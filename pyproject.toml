[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutribuddy"
version = "0.1.0"
description = "RAG diet planner for diabetes, heart and thyroid conditions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
embeddings = ["sentence-transformers>=2.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["nutribuddy[pdf,embeddings,api]"]
dev = ["pytest>=8"]

[project.scripts]
nutribuddy = "nutribuddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
